AutoName: Drum Hero

Summary: Mobile rhythm game focused exclusively on the drums
Description: |
  Drum Hero is a mobile rhythm game similar to Rock Band, Guitar Hero, Clone Hero
  and YARG focused exclusively on the drum instrument.

  <b>Features:</b>

  * 8-lane drum highway (Hi-Hat Closed/Open, Crash, Snare, Kick, Tom 1, Tom 2, Tom 3, Ride)
  * Three control modes: Default, Haptic (kick via accelerometer), and Custom lane reordering
  * Compatible with Clone Hero/YARG song format (MIDI charts + audio stems)
  * Load custom songs from external storage
  * Song timeline, combo counter, hit windows, shockwave effects
  * Free Mode for drum testing without a song

  Songs are loaded from the DrumHero directory in your storage.

RepoType: git
Repo: https://github.com/jdpcdev/drum-hero.git

Builds:
  - versionName: '7.0.0'
    versionCode: 700
    commit: e378270a3541ac3bc206cea4a5e73e8f93ded90c
    subdir: android/build
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    gradle:
      - yes
    srclibs:
      - Godot@4.7-stable
    prebuild:
      - pushd $$Godot$$
      - scons -j`nproc` platform=linuxbsd target=editor
      - popd
      - mkdir -p libs/debug libs/release
      - unzip -j $$Godot$$/bin/android_source.zip "libs/debug/godot-lib.template_debug.aar" -d libs/debug/
      - unzip -j $$Godot$$/bin/android_source.zip "libs/release/godot-lib.template_release.aar" -d libs/release/
      - cd ../../AllFilesAccessPlugin && ./gradlew :plugin:assembleRelease && mkdir -p $$PWD/../addons/AllFilesAccess/bin/release && cp plugin/build/outputs/aar/plugin-release.aar $$PWD/../addons/AllFilesAccess/bin/release/AllFilesAccess.aar
      - cd ../GestureExclusionPlugin && ./gradlew :plugin:assembleRelease && mkdir -p $$PWD/../addons/GestureExclusion/bin/release && cp plugin/build/outputs/aar/plugin-release.aar $$PWD/../addons/GestureExclusion/bin/release/GestureExclusion.aar
    scandelete:
      - .godot
      - addons/*/bin
    build:
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path $$PWD/../.. --export-release "Drum Hero" $$PWD/../outputs/apk/release/drum-hero-release-unsigned.apk

MaintainerNotes: |
  This app uses custom Android plugins (AllFilesAccess, GestureExclusion) included in source.
  MANAGE_EXTERNAL_STORAGE permission is used to load custom songs from external directories.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: project.godot|config/version="([0-9.]+)"|.|export_presets.cfg|version/name="([0-9.]+)"|.|export_presets.cfg|version/code=([0-9]+)|version/code
