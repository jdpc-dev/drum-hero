Categories:
  - Casual Game
License: GPL-3.0-or-later
SourceCode: https://github.com/jdpc-dev/drum-hero
IssueTracker: https://github.com/jdpc-dev/drum-hero/issues

AutoName: Drum Hero

RepoType: git
Repo: https://github.com/jdpc-dev/drum-hero.git

Builds:
  - versionName: 7.0.0
    versionCode: 700
    commit: 086cc3aee889211e2d3f84d1331abc08bb52f40a
    timeout: 10800
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++
    output: com.drum.hero.apk
    srclibs:
      - Godot@4.7-stable
    build:
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$PATH
      - pushd $$Godot$$
      - scons -j$(nproc) target=editor platform=linuxbsd
      - scons -j$(nproc) target=template_release platform=android arch=arm64 production=yes
        swappy=no generate_android_binaries=yes
      - popd
      - mkdir -p $HOME/.local/share/godot/export_templates/4.7.stable
      - cp $$Godot$$/bin/android_source.zip $HOME/.local/share/godot/export_templates/4.7.stable/
      - sed -i -e 's#^architectures/armeabi-v7a=.*#architectures/armeabi-v7a=false#'
        -e 's#^architectures/arm64-v8a=.*#architectures/arm64-v8a=true#' -e 's#^architectures/x86=.*#architectures/x86=false#'
        -e 's#^architectures/x86_64=.*#architectures/x86_64=false#' -e 's#^package/signed=.*#package/signed=false#'
        export_presets.cfg
      - rm -f AllFilesAccessPlugin/local.properties GestureExclusionPlugin/local.properties
      - sed -i '/buildToolsVersion/d' AllFilesAccessPlugin/plugin/build.gradle.kts
      - gradle --no-daemon -p AllFilesAccessPlugin :plugin:assembleRelease
      - mkdir -p addons/AllFilesAccess/bin/release
      - cp AllFilesAccessPlugin/plugin/build/outputs/aar/plugin-release.aar addons/AllFilesAccess/bin/release/AllFilesAccess.aar
      - gradle --no-daemon -p GestureExclusionPlugin :plugin:assembleRelease
      - mkdir -p addons/GestureExclusion/bin/release
      - cp GestureExclusionPlugin/plugin/build/outputs/aar/plugin-release.aar addons/GestureExclusion/bin/release/GestureExclusion.aar
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path $PWD --import
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path $PWD --install-android-build-template
        --export-release "Drum Hero" $PWD/com.drum.hero.apk
    ndk: r29

MaintainerNotes: |
  This app uses custom Android plugins (AllFilesAccess, GestureExclusion) included in source.
  MANAGE_EXTERNAL_STORAGE permission is used to load custom songs from external directories.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
CurrentVersion: 7.0.0
CurrentVersionCode: 700
